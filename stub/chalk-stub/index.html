<!doctype html>
<html>
<head><meta charset="utf-8"><title>Chalk stub</title></head>
<body style="background:#16181d;color:#e6e8eb;font-family:sans-serif">
  <h1>Chalk stub</h1>
  <p>board: <span id="board-id"></span> <span id="board-name"></span></p>
  <p>sidebar: <span id="sidebar-state">closed</span></p>
  <p>embed: <span id="embed-flag"></span></p>
  <p>ready: <span id="ready">no</span></p>
  <p>library reloads: <span id="reload-count">0</span> (pages: <span id="page-count">0</span>)</p>
  <p>
    <button id="send-library-changed" type="button">Send library-changed</button>
    <button id="send-toggle-terminal" type="button">Send toggle-terminal</button>
  </p>
  <script>
    var params = new URLSearchParams(location.search);
    var board = params.get('board');
    var sidebarOpen = false;
    var reloads = 0;
    function send(msg) {
      if (window.parent === window) return;
      window.parent.postMessage(Object.assign({ source: 'chalk' }, msg), '*');
    }
    function loadLibrary() {
      return fetch('/api/library').then(function (r) { return r.json(); });
    }
    function findPage(lib, id) {
      var found = null;
      lib.notebooks.forEach(function (nb) { nb.sections.forEach(function (s) { s.pages.forEach(function (p) { if (p.id === id) found = p; }); }); });
      return found;
    }
    function countPages(lib) {
      var n = 0;
      lib.notebooks.forEach(function (nb) { nb.sections.forEach(function (s) { n += s.pages.length; }); });
      return n;
    }
    function showBoard(id) {
      // unknown ids fall back to the start page in real Chalk; the stub just ignores them
      return loadLibrary().then(function (lib) {
        var p = findPage(lib, id);
        if (!p) return;
        board = id;
        document.getElementById('board-id').textContent = id;
        document.getElementById('board-name').textContent = p.name;
        send({ type: 'chalk:board', id: id, name: p.name });
      });
    }
    function setSidebar(open) {
      sidebarOpen = open;
      document.getElementById('sidebar-state').textContent = open ? 'open' : 'closed';
      send({ type: 'chalk:sidebar', open: open });
    }
    function reloadLibrary() {
      return loadLibrary().then(function (lib) {
        reloads += 1;
        document.getElementById('reload-count').textContent = String(reloads);
        document.getElementById('page-count').textContent = String(countPages(lib));
        var p = board && findPage(lib, board);
        if (p) document.getElementById('board-name').textContent = p.name;
      });
    }
    document.getElementById('embed-flag').textContent = params.get('embed') === '1' ? 'yes' : 'no';
    document.getElementById('send-library-changed').addEventListener('click', function () {
      send({ type: 'chalk:library-changed' });
    });
    document.getElementById('send-toggle-terminal').addEventListener('click', function () {
      send({ type: 'chalk:toggle-terminal' });
    });
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!d || d.source !== 'atlas') return;
      if (d.type === 'chalk:toggle-sidebar') setSidebar(!sidebarOpen);
      else if (d.type === 'chalk:set-sidebar') setSidebar(!!d.open);
      else if (d.type === 'chalk:open-board') showBoard(d.id);
      else if (d.type === 'chalk:library-changed') reloadLibrary();
    });
    send({ type: 'chalk:ready' });
    setSidebar(false);
    if (board) showBoard(board);
  </script>
</body>
</html>
