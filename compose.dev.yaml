name: atlas-dev
services:
  api:
    image: atlas-api-dev:local
    build:
      context: .
      target: api-dev
    environment:
      ATLAS_BRAIN_LABEL: ${AIOS_DIR:-/home/ben/Atlas/aios}
      ATLAS_TERMINAL_URL: ${ATLAS_TERMINAL_URL:-http://127.0.0.1:7681}
    volumes:
      - ./backend/app:/app/app
      - ${AIOS_DIR:-/home/ben/Atlas/aios}:/aios:ro
    ports:
      - "127.0.0.1:8001:8000"
  web:
    image: atlas-web-dev:local
    build:
      context: .
      target: web-dev
    environment:
      ATLAS_API_PROXY: http://api:8000
    volumes:
      - ./frontend:/web
      - /web/node_modules
    ports:
      - "127.0.0.1:5174:5174"
    depends_on:
      - api
