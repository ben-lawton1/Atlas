name: atlas
services:
  app:
    image: atlas-app:local
    build:
      context: .
      target: runtime
    ports:
      - "${ATLAS_BIND:-127.0.0.1}:8090:8000"
    environment:
      ATLAS_BRAIN_LABEL: ${AIOS_DIR:-/home/ben/Atlas/aios}
      ATLAS_TERMINAL_URL: ${ATLAS_TERMINAL_URL:-http://127.0.0.1:7681}
    volumes:
      - ${AIOS_DIR:-/home/ben/Atlas/aios}:/aios:ro   # D6: the brain is read-only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped
