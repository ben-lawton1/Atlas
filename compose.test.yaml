name: atlas-test
x-health: &health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 5s
  start_interval: 1s
services:
  app-test:                         # runtime image with the FIXTURE brain, never the real one
    image: atlas-app-test:${ATLAS_TEST_TAG:-local}
    build:
      context: .
      target: runtime
    environment:
      ATLAS_BRAIN_LABEL: fixture-brain
      ATLAS_TERMINAL_URL: http://term-test:7681
    volumes:
      - ./backend/tests/fixtures/aios:/aios:ro
    healthcheck: *health
  term-test:                        # the terminal bridge (Linux build) for the dock e2e; private network only
    image: atlas-term-test:${ATLAS_TEST_TAG:-local}
    build:
      context: ./bridge
      target: runtime
    command: ["--addr", "0.0.0.0:7681", "--allow-non-loopback", "--config", "/etc/atlas-test/e2e-terminal.json"]
    volumes:
      - ./bridge/testdata:/etc/atlas-test:ro   # e2e-terminal.json (sh + a fake `claude` profile) and fake-claude.sh
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Origin: http://app-test:8000", "http://term-test:7681/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 2s
      start_interval: 1s
  e2e:
    image: atlas-e2e:${ATLAS_TEST_TAG:-local}
    build:
      context: ./e2e
    depends_on:
      app-test:
        condition: service_healthy
      term-test:
        condition: service_healthy
    environment:
      BASE_URL: http://app-test:8000
      CI: "1"
    ipc: host
    init: true
    volumes:
      - ./e2e/tests:/e2e/tests:ro
      - ./e2e/artifacts:/e2e/artifacts
  web-unit:
    image: atlas-web-dev:${ATLAS_TEST_TAG:-local}
    profiles: ["unit"]
    build:
      context: .
      target: web-dev
    volumes:
      - ./frontend/src:/web/src:ro
    command: ["npm", "run", "check"]
  api-unit:
    image: atlas-api-dev:${ATLAS_TEST_TAG:-local}
    profiles: ["unit"]
    build:
      context: .
      target: api-dev
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/tests:/app/tests:ro
    command: ["pytest"]
